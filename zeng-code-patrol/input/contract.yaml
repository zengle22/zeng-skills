# Input Contract: zeng-code-patrol

## Required Inputs

- `paths`: Array of directory or file paths to scan (default: current directory)

## Optional Inputs

- `scope`: Scan mode — `full` | `delta` | `staged` | `targeted` (default: `full`)
- `format`: Output report format — `markdown` | `json` (default: `markdown`)
- `max_files`: Maximum number of files to scan (default: 500)
- `max_file_size`: Single file size limit in bytes (default: 1048576 = 1MB)
- `since_days`: For `delta` scope, scan only files modified within N days (default: 7)
- `output_dir`: Output directory for patrol artifacts (default: `.zeng-code-patrol`)
- `baseline`: Path to previous patrol report for baseline comparison (optional)
- `ruleset`: Path to custom ruleset YAML (optional; default loads `.zeng-code-patrol-config/ruleset.yaml`)
- `min_severity`: Minimum severity to include — `P0` | `P1` | `P2` | `P3` (default: `P3`)
- `fix_mode`: Fix suggestion mode — `report-only` | `suggest-fixes` (default: `report-only`)
- `non_interactive`: Disable interactive prompts (default: false)
- `resume`: Patrol ID to resume an incomplete scan (optional)
- `fail_on_p0p1`: Return exit code 1 when P0/P1 issues found (default: false)

## Input Validation

- [ ] At least one path resolves to an existing directory or file
- [ ] `scope` is one of the allowed enum values
- [ ] `format` is one of the allowed enum values
- [ ] `max_files` > 0 and <= 10000
- [ ] `max_file_size` > 0
- [ ] `min_severity` is one of P0/P1/P2/P3
- [ ] `ruleset` path points to valid YAML when provided
- [ ] `baseline` path points to valid JSON when provided
- [ ] `resume` patrol ID points to existing `patrol-state.json` when provided
- [ ] For `delta` / `staged` scope, git repository must be available
