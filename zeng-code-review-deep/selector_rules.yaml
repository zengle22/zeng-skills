# ADR-058 Agent Selector Rules
# MVP: hard-coded rules with keyword / file-suffix / diff-pattern matching
# Future: LLM-based intelligent selector

version: "1.0"

# === CORE AGENTS (always active) ===
core_agents:
  - consistency-hunter
  - standards-guardian
  - logic-verifier
  - data-architect
  - security-expert

# === LANGUAGE EXPERTS (triggered by file suffix) ===
language_experts:
  - agent_id: python-expert
    trigger:
      file_suffix: [".py"]
  - agent_id: ts-expert
    trigger:
      file_suffix: [".ts", ".tsx"]
  - agent_id: go-expert
    trigger:
      file_suffix: [".go"]

# === SPECIALIST AGENTS (triggered by diff content / file type / PR metadata) ===
specialist_agents:
  - agent_id: contract-guardian
    dimensions: [C11]
    trigger:
      file_patterns: ["**/api/**", "**/dto/**", "**/proto/**", "**/openapi/**", "**/client/**"]
      diff_keywords: ["api", "endpoint", "dto", "schema", "protobuf", "openapi"]

  - agent_id: ai-code-inspector
    dimensions: [C12]
    trigger:
      diff_keywords: ["TODO", "FIXME", "mock", "console.log", "print(", "debugger"]
      pr_metadata_keywords: ["ai-generated", "copilot", "cursor", "generated by ai"]
    # C12 is also triggered by commit message analysis (outside this file)

  - agent_id: requirement-aligner
    dimensions: [C13]
    trigger:
      frz_exists: true
      file_patterns: ["**/src/**"]
    notes: "If FRZ package is not available, this agent runs in preview mode (checks source_refs only)."

  - agent_id: test-auditor
    dimensions: [C14]
    trigger:
      file_patterns: ["**/test*/**", "**/*test*", "**/*spec*"]
      file_suffix: [".test.ts", ".test.tsx", ".test.py", ".spec.ts", ".spec.tsx", ".spec.py"]

# === MODERATOR (always active) ===
moderator: moderator

# === MAX AGENTS PER RUN ===
max_agents: 10
